name: Build release artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libgtk-3-dev libjson-glib-dev libcurl4-openssl-dev liblz4-dev \
            zlib1g-dev libfuse2 file xvfb
      - name: Build native AppImage
        run: ./linux/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BlizzGet-Linux-x86_64.AppImage
          path: dist/BlizzGet-Linux-x86_64.AppImage
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            mingw-w64-i686-gcc
            mingw-w64-i686-curl
            mingw-w64-i686-zlib
            mingw-w64-i686-lz4
            mingw-w64-i686-pkgconf
          path-type: inherit
      - name: Build Windows executable
        shell: msys2 {0}
        run: |
          chmod +x windows/build-windows.sh
          ./windows/build-windows.sh
          cp dist/BlizzGet.exe dist/BlizzGet-Windows-x86.exe
      - uses: actions/upload-artifact@v4
        with:
          name: BlizzGet-Windows-x86.exe
          path: dist/BlizzGet-Windows-x86.exe
          if-no-files-found: error

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist/BlizzGet-Linux-x86_64.AppImage \
              dist/BlizzGet-Windows-x86.exe --clobber
            gh release edit "$RELEASE_TAG" --title "BlizzGet $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" \
              dist/BlizzGet-Linux-x86_64.AppImage \
              dist/BlizzGet-Windows-x86.exe \
              --target "$GITHUB_SHA" \
              --title "BlizzGet $RELEASE_TAG" --generate-notes
          fi
