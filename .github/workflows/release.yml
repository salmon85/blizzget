name: Build release artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libgtk-3-dev libjson-glib-dev libcurl4-openssl-dev liblz4-dev \
            zlib1g-dev libfuse2 file xvfb
      - name: Build native AppImage
        run: ./linux/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BlizzGet-Linux-x86_64.AppImage
          path: dist/BlizzGet-Linux-x86_64.AppImage
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Build Windows app
        shell: pwsh
        run: |
          $msbuild = (Get-Command msbuild.exe -ErrorAction SilentlyContinue).Source
          if (-not $msbuild) {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          }
          & $msbuild vc13\BlizzGet.sln /m /p:Configuration=Release /p:Platform=Win32
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = Get-ChildItem -Path vc13 -Recurse -Filter BlizzGet.exe |
            Where-Object { $_.FullName -match '\\Release\\' } |
            Select-Object -First 1
          if (-not $exe) { throw 'BlizzGet.exe was not produced' }
          Copy-Item $exe.FullName dist\BlizzGet.exe
          Compress-Archive -Path dist\BlizzGet.exe -DestinationPath dist\BlizzGet-Windows-x86.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: BlizzGet-Windows-x86.zip
          path: dist/BlizzGet-Windows-x86.zip
          if-no-files-found: error

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist/BlizzGet-Linux-x86_64.AppImage \
              dist/BlizzGet-Windows-x86.zip --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/BlizzGet-Linux-x86_64.AppImage \
              dist/BlizzGet-Windows-x86.zip --generate-notes
          fi
